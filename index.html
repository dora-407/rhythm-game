<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON DANCE FEVER 90s - 霓虹跳舞機</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --lane-bg: rgba(20, 24, 38, 0.85);
      --c-left: #ff007f;    /* 螢光粉 */
      --c-down: #00f0ff;    /* 螢光藍 */
      --c-up: #ffe600;      /* 螢光黃 */
      --c-right: #05ffa1;   /* 螢光綠 */
      --neon-glow: 0 0 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Courier New', Courier, monospace;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 90s CRT 掃描線效果 */
    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px;
      z-index: 100;
      pointer-events: none;
      opacity: 0.6;
    }

    #game-container {
      position: relative;
      width: 440px;
      height: 700px;
      background: #111420;
      border: 3px solid #ff007f;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.4), inset 0 0 20px rgba(0, 240, 255, 0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 頂部 HUD */
    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: rgba(0, 0, 0, 0.6);
      border-bottom: 2px solid #333;
      z-index: 10;
    }

    .hud-title {
      font-weight: bold;
      color: #00f0ff;
      text-shadow: 0 0 6px #00f0ff;
      font-size: 0.95rem;
    }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hud-score {
      font-size: 1.15rem;
      font-weight: bold;
      color: #ffe600;
      text-shadow: 0 0 8px #ffe600;
    }

    .pause-icon-btn {
      background: transparent;
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0, 240, 255, 0.3);
      transition: all 0.1s;
    }
    .pause-icon-btn:hover {
      background: #00f0ff;
      color: #000;
    }

    /* 跳舞機軌道區域 (由下往上) */
    #track-area {
      position: relative;
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--lane-bg);
      border-left: 2px solid #222;
      border-right: 2px solid #222;
      overflow: hidden;
    }

    .lane {
      position: relative;
      border-right: 1px dashed rgba(255, 255, 255, 0.08);
      height: 100%;
    }
    .lane:last-child { border-right: none; }

    /* 判定基準線 (Judgment Baseline) */
    .judgment-line {
      position: absolute;
      top: 145px; /* 剛好穿過 50px~110px 判定箭頭正中心 */
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, 
        rgba(255, 0, 127, 0.8), 
        rgba(0, 240, 255, 0.8), 
        rgba(255, 230, 0, 0.8), 
        rgba(5, 255, 161, 0.8));
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.8), 0 0 20px rgba(255, 0, 127, 0.6);
      z-index: 3;
      pointer-events: none;
    }

    /* 頂部判定標靶 (Receptors) */
    .receptors-bar {
      position: absolute;
      top: 50px;
      left: 0;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      height: 60px;
      z-index: 5;
    }

    .receptor {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.2rem;
      font-weight: bold;
      opacity: 0.45;
      transition: transform 0.05s, opacity 0.05s;
    }

    .receptor.active {
      opacity: 1;
      transform: scale(1.15);
      text-shadow: 0 0 20px currentColor;
    }

    .arrow-0 { color: var(--c-left); }
    .arrow-1 { color: var(--c-down); }
    .arrow-2 { color: var(--c-up); }
    .arrow-3 { color: var(--c-right); }

    /* 音符 (飄動箭頭) */
    .note {
      position: absolute;
      width: 100%;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.4rem;
      font-weight: 900;
      will-change: transform;
      z-index: 4;
      text-shadow: 0 0 10px currentColor;
    }

    /* 判定字樣與連擊顯示 */
    #feedback-layer {
      position: absolute;
      top: 155px;
      width: 100%;
      text-align: center;
      pointer-events: none;
      z-index: 20;
    }

    #judgment-text {
      font-size: 2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      height: 36px;
      transition: transform 0.08s;
    }

    .j-perfect { color: #ffe600; text-shadow: 0 0 15px #ffe600; }
    .j-great   { color: #05ffa1; text-shadow: 0 0 15px #05ffa1; }
    .j-good    { color: #00f0ff; text-shadow: 0 0 15px #00f0ff; }
    .j-miss    { color: #ff0055; text-shadow: 0 0 15px #ff0055; }

    #combo-text {
      font-size: 1.2rem;
      color: #fff;
      margin-top: 5px;
      letter-spacing: 1px;
    }
    #combo-count {
      font-size: 2rem;
      font-weight: bold;
      color: #ff007f;
      text-shadow: 0 0 10px #ff007f;
    }

    /* 覆蓋面板 */
    .screen-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 12, 16, 0.94);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      z-index: 50;
      text-align: center;
    }

    .hidden { display: none !important; }

    h1.game-title {
      font-size: 2.1rem;
      color: #00f0ff;
      text-shadow: 0 0 12px #00f0ff, 0 0 25px #ff007f;
      margin-bottom: 25px;
      line-height: 1.2;
    }

    .panel-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      width: 100%;
    }

    .key-hint {
      display: flex;
      justify-content: space-around;
      margin-top: 10px;
      font-size: 0.9rem;
      color: #aaa;
    }
    .key-badge {
      display: inline-block;
      padding: 3px 8px;
      background: #222;
      border: 1px solid #555;
      border-radius: 4px;
      color: #fff;
      font-weight: bold;
    }

    .select-song {
      width: 100%;
      padding: 10px;
      background: #191c28;
      color: #ffe600;
      border: 2px solid #00f0ff;
      font-size: 1rem;
      font-family: inherit;
      border-radius: 6px;
      margin-bottom: 20px;
      cursor: pointer;
      outline: none;
    }

    button.arcade-btn {
      background: #ff007f;
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1.2rem;
      font-family: inherit;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 15px #ff007f;
      transition: all 0.15s ease-in-out;
      margin: 8px 0;
    }

    button.arcade-btn:hover {
      background: #ff2a9d;
      box-shadow: 0 0 25px #ff007f;
      transform: scale(1.05);
    }

    button.arcade-btn.secondary {
      background: transparent;
      border: 2px solid #00f0ff;
      color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }
    button.arcade-btn.secondary:hover {
      background: rgba(0, 240, 255, 0.15);
      box-shadow: 0 0 20px #00f0ff;
    }

    /* 結算數值排版 */
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      font-size: 1.1rem;
    }
    .grade-badge {
      font-size: 4rem;
      font-weight: 900;
      margin: 10px 0;
      text-shadow: 0 0 20px currentColor;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 頂部資訊 -->
    <div id="hud">
      <div id="current-song-label" class="hud-title">TRACK 1</div>
      <div class="hud-right">
        <div class="hud-score">SCORE: <span id="score-display">000000</span></div>
        <button id="btn-pause" class="pause-icon-btn" title="暫停 (ESC)">PAUSE [ESC]</button>
      </div>
    </div>

    <!-- 打擊判定即時顯示 -->
    <div id="feedback-layer">
      <div id="judgment-text"></div>
      <div id="combo-text"><span id="combo-count"></span> COMBO</div>
    </div>

    <!-- 判定基準水平線 (新增：對齊頂部箭頭中心) -->
    <div class="judgment-line"></div>

    <!-- 頂部判定標靶 (Receptors) -->
    <div class="receptors-bar">
      <div class="receptor arrow-0" id="rec-0">◀</div>
      <div class="receptor arrow-1" id="rec-1">▼</div>
      <div class="receptor arrow-2" id="rec-2">▲</div>
      <div class="receptor arrow-3" id="rec-3">▶</div>
    </div>

    <!-- 音符流動軌道 -->
    <div id="track-area">
      <div class="lane" id="lane-0"></div>
      <div class="lane" id="lane-1"></div>
      <div class="lane" id="lane-2"></div>
      <div class="lane" id="lane-3"></div>
    </div>

    <!-- 1. 首頁選單 -->
    <div id="start-screen" class="screen-overlay">
      <h1 class="game-title">NEON DANCE<br>FEVER 90s</h1>

      <div class="panel-box">
        <p style="margin-bottom: 8px; font-weight: bold; color: #00f0ff;">操作鍵位配置 (8鍵皆通)</p>
        <div class="key-hint">
          <span>◀ : <b class="key-badge">A</b> / <b class="key-badge">←</b></span>
          <span>▼ : <b class="key-badge">S</b> / <b class="key-badge">↓</b></span>
        </div>
        <div class="key-hint">
          <span>▲ : <b class="key-badge">W</b> / <b class="key-badge">↑</b></span>
          <span>▶ : <b class="key-badge">D</b> / <b class="key-badge">→</b></span>
        </div>
        <div style="margin-top: 10px; font-size: 0.85rem; color: #ffe600;">
          暫停遊戲：<b class="key-badge">ESC</b> 鍵
        </div>
      </div>

      <select id="song-select" class="select-song">
        <option value="0">Track 1: Cyber Funk (BPM 120)</option>
        <option value="1">Track 2: Tokyo Rave (BPM 140)</option>
      </select>

      <button id="btn-start" class="arcade-btn">PRESS TO PLAY</button>
    </div>

    <!-- 2. 暫停畫面 -->
    <div id="pause-screen" class="screen-overlay hidden">
      <h2 style="color: #ffe600; text-shadow: 0 0 12px #ffe600; margin-bottom: 25px; font-size: 2rem;">PAUSED</h2>
      <button id="btn-resume" class="arcade-btn">RESUME</button>
      <button id="btn-quit" class="arcade-btn secondary">QUIT TO MENU</button>
    </div>

    <!-- 3. 結算畫面 -->
    <div id="result-screen" class="screen-overlay hidden">
      <h2 style="color: #00f0ff; text-shadow: 0 0 10px #00f0ff;">STAGE CLEAR</h2>
      <div id="grade-display" class="grade-badge">A</div>

      <div class="panel-box">
        <div class="stat-row"><span>FINAL SCORE:</span><b id="final-score" style="color:#ffe600;">0</b></div>
        <div class="stat-row"><span>MAX COMBO:</span><b id="max-combo" style="color:#ff007f;">0</b></div>
        <hr style="border:0; border-top:1px dashed #444; margin: 10px 0;">
        <div class="stat-row"><span style="color:#ffe600;">PERFECT</span><b id="cnt-perfect">0</b></div>
        <div class="stat-row"><span style="color:#05ffa1;">GREAT</span><b id="cnt-great">0</b></div>
        <div class="stat-row"><span style="color:#00f0ff;">GOOD</span><b id="cnt-good">0</b></div>
        <div class="stat-row"><span style="color:#ff0055;">MISS</span><b id="cnt-miss">0</b></div>
      </div>

      <button id="btn-restart" class="arcade-btn">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    /* =========================================================
       1. 音樂與音效合成引擎 (Web Audio API)
       ========================================================= */
    const AudioEngine = {
      ctx: null,
      isPlaying: false,
      isPaused: false,
      bpm: 120,
      startTime: 0,
      pauseTime: 0,
      timerId: null,
      currentStep: 0,
      totalSteps: 16 * 16,
      songIndex: 0,
      onEndCallback: null,

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      },

      playHitClap() {
        if (!this.ctx || this.isPaused) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.07);

        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.07);
      },

      triggerKick(time) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(140, time);
        osc.frequency.exponentialRampToValueAtTime(35, time + 0.12);
        gain.gain.setValueAtTime(0.65, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(time);
        osc.stop(time + 0.12);
      },

      triggerNoise(time, isSnare) {
        const bufferSize = this.ctx.sampleRate * (isSnare ? 0.1 : 0.03);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(isSnare ? 0.35 : 0.12, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + (isSnare ? 0.1 : 0.03));
        noise.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(time);
      },

      triggerBass(time, freq, duration) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = this.songIndex === 0 ? "sawtooth" : "square";
        osc.frequency.setValueAtTime(freq, time);
        gain.gain.setValueAtTime(0.18, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(time);
        osc.stop(time + duration);
      },

      startBgm(songIndex, onEndCallback) {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.isPlaying = true;
        this.isPaused = false;
        this.songIndex = songIndex;
        this.bpm = songIndex === 0 ? 120 : 140;
        this.currentStep = 0;
        this.onEndCallback = onEndCallback;
        this.startTime = this.ctx.currentTime + 0.2;

        this.schedule();
      },

      schedule() {
        if (!this.isPlaying || this.isPaused) return;
        const stepInterval = (60 / this.bpm) / 4;
        const stepTime = this.startTime + (this.currentStep * stepInterval);

        if (this.currentStep >= this.totalSteps) {
          this.isPlaying = false;
          setTimeout(() => { if (this.onEndCallback) this.onEndCallback(); }, 1200);
          return;
        }

        if (this.songIndex === 0) {
          if (this.currentStep % 4 === 0) this.triggerKick(stepTime);
          if (this.currentStep % 8 === 4) this.triggerNoise(stepTime, true);
          if (this.currentStep % 2 === 0) this.triggerNoise(stepTime, false);

          const funkScale = [55, 65.4, 73.4, 82.4, 98];
          if (this.currentStep % 4 === 0 || this.currentStep % 4 === 3) {
            const noteIdx = (Math.floor(this.currentStep / 4) + (this.currentStep % 4)) % funkScale.length;
            this.triggerBass(stepTime, funkScale[noteIdx], stepInterval * 1.5);
          }
        } else {
          if (this.currentStep % 4 === 0) this.triggerKick(stepTime);
          this.triggerNoise(stepTime, false);
          if (this.currentStep % 8 === 4) this.triggerNoise(stepTime, true);

          const raveNotes = [46.2, 55, 61.7, 73.4];
          if (this.currentStep % 2 === 1) {
            const note = raveNotes[Math.floor(this.currentStep / 8) % raveNotes.length];
            this.triggerBass(stepTime, note, stepInterval * 0.9);
          }
        }

        this.currentStep++;
        const delay = (stepTime - this.ctx.currentTime) * 1000;
        this.timerId = setTimeout(() => this.schedule(), Math.max(10, delay - 25));
      },

      pauseBgm() {
        if (!this.isPlaying || this.isPaused) return;
        this.isPaused = true;
        this.pauseTime = this.ctx.currentTime;
        if (this.timerId) clearTimeout(this.timerId);
        if (this.ctx) this.ctx.suspend();
      },

      resumeBgm() {
        if (!this.isPlaying || !this.isPaused) return;
        if (this.ctx) {
          this.ctx.resume().then(() => {
            const pauseDuration = this.ctx.currentTime - this.pauseTime;
            this.startTime += pauseDuration;
            this.isPaused = false;
            this.schedule();
          });
        }
      },

      stopBgm() {
        this.isPlaying = false;
        this.isPaused = false;
        if (this.timerId) clearTimeout(this.timerId);
      },

      getCurrentSongTime() {
        if (!this.ctx || !this.isPlaying) return 0;
        if (this.isPaused) return Math.max(0, this.pauseTime - this.startTime);
        return Math.max(0, this.ctx.currentTime - this.startTime);
      }
    };

    /* =========================================================
       2. 人工精編專屬譜面 (兩首歌獨立節奏，四鍵皆有)
       ========================================================= */
    function buildCharts(bpm, songIndex) {
      const beat = 60 / bpm;
      const notes = [];
      let idCounter = 0;

      const add = (lane, beatOffset) => {
        notes.push({ lane, time: beatOffset * beat, hit: false, id: `n_${idCounter++}` });
      };

      if (songIndex === 0) {
        for (let bar = 1; bar < 15; bar++) {
          const b = bar * 4;
          const section = bar % 4;

          if (section === 0) {
            add(0, b + 0);
            add(1, b + 1);
            add(2, b + 2);
            add(3, b + 3);
          } else if (section === 1) {
            add(1, b + 0);
            add(0, b + 1);
            add(1, b + 2);
            add(3, b + 3);
          } else if (section === 2) {
            add(2, b + 0);
            add(1, b + 1);
            add(2, b + 2);
            add(0, b + 3);
          } else {
            add(0, b + 0); add(3, b + 0);
            add(1, b + 2); add(2, b + 2);
            add(1, b + 3);
          }
        }
      } else {
        for (let bar = 1; bar < 15; bar++) {
          const b = bar * 4;
          const section = bar % 4;

          if (section === 0) {
            add(0, b + 0);
            add(1, b + 1);
            add(2, b + 1.5);
            add(3, b + 2);
            add(2, b + 3);
            add(1, b + 3.5);
          } else if (section === 1) {
            add(0, b + 0); add(3, b + 0);
            add(1, b + 1);
            add(2, b + 2);
            add(0, b + 3); add(3, b + 3);
          } else if (section === 2) {
            add(1, b + 0);
            add(1, b + 0.5);
            add(2, b + 1.5);
            add(2, b + 2);
            add(3, b + 3);
            add(0, b + 3.5);
          } else {
            add(0, b + 0); add(2, b + 0);
            add(1, b + 1.5); add(3, b + 1.5);
            add(0, b + 2.5); add(3, b + 2.5);
            add(1, b + 3.5);
          }
        }
      }

      return notes.sort((a, b) => a.time - b.time);
    }

    /* =========================================================
       3. 核心配置與按鍵映射
       ========================================================= */
    const KEY_MAPPINGS = {
      'KeyA': 0, 'ArrowLeft': 0,
      'KeyS': 1, 'ArrowDown': 1,
      'KeyW': 2, 'ArrowUp': 2,
      'KeyD': 3, 'ArrowRight': 3
    };
    const ARROW_SYMBOLS = ['◀', '▼', '▲', '▶'];

    const RECEPTOR_Y = 50;
    const SPAWN_Y = 660;
    const NOTE_SPEED = 420;
    const TRAVEL_TIME = (SPAWN_Y - RECEPTOR_Y) / NOTE_SPEED;

    let currentChart = [];
    let score = 0;
    let combo = 0;
    let maxCombo = 0;
    let stats = { perfect: 0, great: 0, good: 0, miss: 0 };
    let activeNotes = [];
    let isGamePaused = false;

    // DOM 快取
    const startScreen = document.getElementById('start-screen');
    const pauseScreen = document.getElementById('pause-screen');
    const resultScreen = document.getElementById('result-screen');
    const scoreDisplay = document.getElementById('score-display');
    const judgmentText = document.getElementById('judgment-text');
    const comboCount = document.getElementById('combo-count');
    const comboText = document.getElementById('combo-text');
    const laneEls = [
      document.getElementById('lane-0'),
      document.getElementById('lane-1'),
      document.getElementById('lane-2'),
      document.getElementById('lane-3')
    ];
    const recEls = [
      document.getElementById('rec-0'),
      document.getElementById('rec-1'),
      document.getElementById('rec-2'),
      document.getElementById('rec-3')
    ];

    /* =========================================================
       4. 遊戲主循環
       ========================================================= */
    let animationFrameId = null;

    function gameLoop() {
      if (isGamePaused) return;

      const songTime = AudioEngine.getCurrentSongTime();

      currentChart.forEach(note => {
        if (!note.spawned && songTime >= note.time - TRAVEL_TIME) {
          createNoteElement(note);
          note.spawned = true;
        }
      });

      for (let i = activeNotes.length - 1; i >= 0; i--) {
        const item = activeNotes[i];
        const timeDiff = item.data.time - songTime;
        const currentY = RECEPTOR_Y + (timeDiff * NOTE_SPEED);

        if (timeDiff < -0.135 && !item.data.hit) {
          triggerJudgment("MISS");
          item.data.hit = true;
          removeNoteElement(item, i);
          continue;
        }

        if (currentY < -60) {
          removeNoteElement(item, i);
          continue;
        }

        item.el.style.transform = `translateY(${currentY}px)`;
      }

      if (AudioEngine.isPlaying) {
        animationFrameId = requestAnimationFrame(gameLoop);
      }
    }

    function createNoteElement(note) {
      const el = document.createElement('div');
      el.className = `note arrow-${note.lane}`;
      el.innerText = ARROW_SYMBOLS[note.lane];
      laneEls[note.lane].appendChild(el);
      activeNotes.push({ el, data: note });
    }

    function removeNoteElement(item, index) {
      if (item.el.parentNode) {
        item.el.parentNode.removeChild(item.el);
      }
      activeNotes.splice(index, 1);
    }

    /* =========================================================
       5. 按鍵監聽與判定
       ========================================================= */
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Escape') {
        if (AudioEngine.isPlaying) {
          if (isGamePaused) resumeGame();
          else pauseGame();
        }
        return;
      }

      if (isGamePaused || e.repeat) return;

      const lane = KEY_MAPPINGS[e.code];
      if (lane !== undefined) {
        recEls[lane].classList.add('active');
        if (AudioEngine.isPlaying) {
          judgeInput(lane);
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      const lane = KEY_MAPPINGS[e.code];
      if (lane !== undefined) {
        recEls[lane].classList.remove('active');
      }
    });

    function judgeInput(lane) {
      const songTime = AudioEngine.getCurrentSongTime();
      let closestNote = null;
      let minDiff = Infinity;
      let noteIndex = -1;

      for (let i = 0; i < activeNotes.length; i++) {
        const item = activeNotes[i];
        if (item.data.lane === lane && !item.data.hit) {
          const diff = Math.abs(item.data.time - songTime);
          if (diff < minDiff) {
            minDiff = diff;
            closestNote = item;
            noteIndex = i;
          }
        }
      }

      if (!closestNote) return;

      if (minDiff <= 0.045) {
        triggerJudgment("PERFECT");
        AudioEngine.playHitClap();
        closestNote.data.hit = true;
        removeNoteElement(closestNote, noteIndex);
      } else if (minDiff <= 0.090) {
        triggerJudgment("GREAT");
        AudioEngine.playHitClap();
        closestNote.data.hit = true;
        removeNoteElement(closestNote, noteIndex);
      } else if (minDiff <= 0.135) {
        triggerJudgment("GOOD");
        AudioEngine.playHitClap();
        closestNote.data.hit = true;
        removeNoteElement(closestNote, noteIndex);
      }
    }

    function triggerJudgment(type) {
      judgmentText.className = "";
      judgmentText.innerText = type;

      if (type === "PERFECT") {
        judgmentText.classList.add("j-perfect");
        score += 1000 + combo * 10;
        combo++;
        stats.perfect++;
      } else if (type === "GREAT") {
        judgmentText.classList.add("j-great");
        score += 600 + combo * 5;
        combo++;
        stats.great++;
      } else if (type === "GOOD") {
        judgmentText.classList.add("j-good");
        score += 300;
        combo++;
        stats.good++;
      } else {
        judgmentText.classList.add("j-miss");
        combo = 0;
        stats.miss++;
      }

      if (combo > maxCombo) maxCombo = combo;

      scoreDisplay.innerText = score.toString().padStart(6, '0');
      if (combo > 1) {
        comboText.style.display = 'block';
        comboCount.innerText = combo;
        comboCount.style.transform = 'scale(1.3)';
        setTimeout(() => comboCount.style.transform = 'scale(1)', 60);
      } else {
        comboText.style.display = 'none';
      }
    }

    /* =========================================================
       6. 狀態控制與流程
       ========================================================= */
    function startGame() {
      score = 0;
      combo = 0;
      maxCombo = 0;
      stats = { perfect: 0, great: 0, good: 0, miss: 0 };
      isGamePaused = false;
      clearAllNotes();

      scoreDisplay.innerText = "000000";
      judgmentText.innerText = "";
      comboText.style.display = 'none';

      const songIdx = parseInt(document.getElementById('song-select').value);
      const bpm = songIdx === 0 ? 120 : 140;
      document.getElementById('current-song-label').innerText = songIdx === 0 ? "TRACK 1: 120 BPM" : "TRACK 2: 140 BPM";

      currentChart = buildCharts(bpm, songIdx);

      startScreen.classList.add('hidden');
      pauseScreen.classList.add('hidden');
      resultScreen.classList.add('hidden');

      AudioEngine.startBgm(songIdx, showResults);
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function pauseGame() {
      if (!AudioEngine.isPlaying || isGamePaused) return;
      isGamePaused = true;
      AudioEngine.pauseBgm();
      cancelAnimationFrame(animationFrameId);
      pauseScreen.classList.remove('hidden');
    }

    function resumeGame() {
      if (!isGamePaused) return;
      pauseScreen.classList.add('hidden');
      AudioEngine.resumeBgm();
      isGamePaused = false;
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function quitToMenu() {
      isGamePaused = false;
      AudioEngine.stopBgm();
      cancelAnimationFrame(animationFrameId);
      clearAllNotes();

      pauseScreen.classList.add('hidden');
      resultScreen.classList.add('hidden');
      startScreen.classList.remove('hidden');
    }

    function clearAllNotes() {
      activeNotes.forEach(item => {
        if (item.el.parentNode) item.el.parentNode.removeChild(item.el);
      });
      activeNotes = [];
    }

    function showResults() {
      cancelAnimationFrame(animationFrameId);
      resultScreen.classList.remove('hidden');

      document.getElementById('final-score').innerText = score;
      document.getElementById('max-combo').innerText = maxCombo;
      document.getElementById('cnt-perfect').innerText = stats.perfect;
      document.getElementById('cnt-great').innerText = stats.great;
      document.getElementById('cnt-good').innerText = stats.good;
      document.getElementById('cnt-miss').innerText = stats.miss;

      const totalNotes = stats.perfect + stats.great + stats.good + stats.miss;
      const accuracy = totalNotes > 0 ? (stats.perfect * 1 + stats.great * 0.7 + stats.good * 0.4) / totalNotes : 0;
      
      const gradeEl = document.getElementById('grade-display');
      if (accuracy >= 0.95) {
        gradeEl.innerText = "S";
        gradeEl.style.color = "#ffe600";
      } else if (accuracy >= 0.85) {
        gradeEl.innerText = "A";
        gradeEl.style.color = "#05ffa1";
      } else if (accuracy >= 0.70) {
        gradeEl.innerText = "B";
        gradeEl.style.color = "#00f0ff";
      } else {
        gradeEl.innerText = "C";
        gradeEl.style.color = "#ff007f";
      }
    }

    // 按鈕綁定
    document.getElementById('btn-start').addEventListener('click', startGame);
    document.getElementById('btn-pause').addEventListener('click', pauseGame);
    document.getElementById('btn-resume').addEventListener('click', resumeGame);
    document.getElementById('btn-quit').addEventListener('click', quitToMenu);
    document.getElementById('btn-restart').addEventListener('click', () => {
      resultScreen.classList.add('hidden');
      startScreen.classList.remove('hidden');
    });
  </script>
</body>
</html>
